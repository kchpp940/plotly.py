name: Test

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  test-smoke:
    name: Smoke (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57  # v8.0.0
      - name: Install (dev_core)
        run: |
          uv venv
          source .venv/bin/activate
          uv lock --check
          uv sync --extra dev_core
          python --version
      - name: Run smoke tests
        run: |
          source .venv/bin/activate
          python commands.py test smoke

  test-core:
    name: Core + Schema (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57  # v8.0.0
      - name: Install (dev_core)
        run: |
          uv venv
          source .venv/bin/activate
          uv lock --check
          uv sync --extra dev_core
          python --version
      - name: Run core tests
        run: |
          source .venv/bin/activate
          python commands.py test core
      - name: Run schema/codegen consistency checks
        run: |
          source .venv/bin/activate
          python commands.py test schema

  test-optional:
    name: Optional (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57  # v8.0.0
      - name: Install (dev_optional + pandas3 — no express/kaleido)
        run: |
          uv venv
          source .venv/bin/activate
          uv sync --extra dev_optional --extra dev_pandas3
          python --version
      - name: Run optional-dependency tests
        run: |
          source .venv/bin/activate
          python commands.py test optional

  test-express:
    name: Express regression (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57  # v8.0.0
      - name: Install (dev_optional + pandas3 + express)
        run: |
          uv venv
          source .venv/bin/activate
          uv sync --extra dev_optional --extra dev_pandas3 --extra express
          python --version
      - name: Run Plotly Express regression tests
        run: |
          source .venv/bin/activate
          python commands.py test express

  test-image-export:
    name: Image export (Kaleido, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up Chrome
        uses: ./.github/actions/setup-chrome-for-pytest
      - name: Set up uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57  # v8.0.0
      - name: Install (dev_optional + kaleido)
        run: |
          uv venv
          source .venv/bin/activate
          uv sync --extra dev_optional --extra kaleido
          python --version
      - name: Run static image export tests
        run: |
          source .venv/bin/activate
          python commands.py test image-export

  test-optional-legacy-pandas:
    name: Optional + Express (Python ${{ matrix.python-version }}, pandas ${{ matrix.pandas-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.9"
            pandas-version: "1"
          - python-version: "3.11"
            pandas-version: "2"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up Chrome
        uses: ./.github/actions/setup-chrome-for-pytest
      - name: Set up uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57  # v8.0.0
      - name: Install (dev_optional + pandas${{ matrix.pandas-version }} + express + kaleido)
        run: |
          uv venv
          source .venv/bin/activate
          uv sync --extra dev_optional --extra dev_pandas${{ matrix.pandas-version }} --extra express --extra kaleido
      - name: Run optional-dependency tests
        run: |
          source .venv/bin/activate
          python commands.py test optional
      - name: Run Plotly Express regression tests
        run: |
          source .venv/bin/activate
          python commands.py test express
      - name: Run static image export tests
        run: |
          source .venv/bin/activate
          python commands.py test image-export

  test-kaleido-v0:
    name: Image export (Kaleido v0, Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
      - name: Set up Chrome
        uses: browser-actions/setup-chrome@4f8e94349a351df0f048634f25fec36c3c91eded  # v2.1.1
        with:
          install-chromedriver: true
      - name: Set up uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57  # v8.0.0
      - name: Install (dev_optional + pinned kaleido 0.2.1)
        run: |
          uv venv
          source .venv/bin/activate
          uv sync --extra dev_optional
          uv pip uninstall kaleido
          uv pip install kaleido==0.2.1
          python --version
      - name: Run image export tests with Kaleido v0
        run: |
          source .venv/bin/activate
          python commands.py test image-export
